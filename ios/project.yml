name: CursorRemote
options:
  bundleIdPrefix: cn.kylebing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4J6QFDHMK2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CursorRemote:
    type: application
    platform: iOS
    sources:
      - path: CursorRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.kylebing.cursorremote
        PRODUCT_NAME: CursorRemote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 = iPhone, 2 = iPad，两者通用
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: CursorRemote/Info.plist
      properties:
        CFBundleDisplayName: 远程 Cursor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 默认走 https://kylebing.cn/cursor-remote（正规证书，无需例外）；
        # 保留此开关仅为兼容局域网/Tailscale 的 http 直连回退
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 需要连接同一局域网内运行 cursor-remote 的 Mac
