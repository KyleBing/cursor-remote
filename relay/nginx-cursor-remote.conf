# cursor-remote 的 nginx 站点（放在 /etc/nginx/sites-available/cursor-remote）
# 仅 443，不抢 80，不影响已有站点
server {
    listen 443 ssl http2;
    server_name cr.taiwuict.com;

    # certbot 会自动改写这两行
    ssl_certificate     /etc/letsencrypt/live/cr.taiwuict.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cr.taiwuict.com/privkey.pem;

    # 只要现代 TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:CursorRemote:1m;
    ssl_session_timeout 10m;

    # 交给 frp 隧道，再由 Mac 上的 Go 服务处理
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则事件流会被 nginx 攒住
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # 长连接：任务跑几十分钟也不掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 不放行任何上传体积，减少攻击面
    client_max_body_size 1m;
}
